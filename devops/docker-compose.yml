services:
  jupyterlab:
    build:
      context: ./jupyterlab
      dockerfile: Dockerfile
    image: ${JP_IMAGE}
    container_name: ${JP_CONTAINER}
    ports:
      - "${JP_PORT}:7777"
    volumes:
      - "../main:/home"
      - "../mlflow_files:/mlflow/mlruns"
    labels:
      - "description=Jupyterlab for MLModel"
      - "port=7777"
    networks:
      - ml_model

  mlflow:
    build:
      context: ./mlflow
      dockerfile: Dockerfile
    image: ${MF_IMAGE}
    container_name: ${MF_CONTAINER}
    ports:
      - "${MF_PORT}:5001"
    volumes:
      - "../mlflow_files:/mlflow/mlruns"
    labels:
      - "description=MlFlow for MLModel"
      - "port=5001"
    networks:
      - ml_model

  fastapi:
    build:
      context: ./fastapi
      dockerfile: Dockerfile
    image: ${FA_IMAGE}
    container_name: ${FA_CONTAINER}
    ports:
      - "${FA_PORT}:8502"
    volumes:
      - "../main/my_fastapi_app:/home"
      - "../mlflow_files:/mlflow/mlruns"
    labels:
      - "description=FastAPI for MLModel"
      - "port=8502"
    networks:
      - ml_model

  streamlit:
    build:
      context: ./streamlit
      dockerfile: Dockerfile
    image: ${SL_IMAGE}
    container_name: ${SL_CONTAINER}
    ports:
      - "${SL_PORT}:8501"
    volumes:
      - "../main/my_streamlit_app:/home"
    labels:
      - "description=Streamlit App for MLModel"
      - "port=8501"
    networks:
      - ml_model

networks:
  ml_model:
    driver: bridge